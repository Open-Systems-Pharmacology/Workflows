name: 'Setup R environment'
description: 'Sets up a complete R environment: R, pandoc, dotnet workaround, and renv or dependencies'

inputs:
  r-version:
    description: 'R version to install (e.g. "release", "devel", "4.3.1")'
    required: false
    default: 'release'
  use-public-rspm:
    description: 'Use public RStudio Package Manager'
    required: false
    default: 'true'
  extra-repositories:
    description: >-
      One or more extra CRAN-like repositories to include in the `repos` global
      option. Can be a comma- or space-separated string (e.g.
      'https://repo1.r-universe.dev, https://repo2.r-universe.dev'), or a YAML
      list with one URL per line using the '|' block scalar syntax. Forwarded to
      r-lib/actions/setup-r, together with the `Additional_repositories` of the
      DESCRIPTION in the working directory (a release version lists its
      R-universe there, see manage_description.sh).
    required: false
    default: ''
  setup-pandoc:
    description: 'Whether to install pandoc'
    required: false
    default: 'false'
  setup-tinytex:
    description: 'Whether to install TinyTeX (provides pdflatex for PDF manual builds)'
    required: false
    default: 'false'
  setup-quarto:
    description: 'Whether to install Quarto'
    required: false
    default: 'false'
  dotnet-version:
    description: '.NET SDK version to install on all runners (e.g. "8.0.x", "10.0.x"). Set to an empty string to skip the setup-dotnet step and use whatever the runner image ships with (which may be no .NET at all, e.g. on macOS).'
    required: false
    default: '8.0.x'
  check-dependencies:
    description: >-
      Fail when the OSP dependency fields of DESCRIPTION do not match the
      Version (manage_description.sh check-dependencies): a dev version that
      still has the release fields, or a release version with Remotes. The log
      explains how to fix it. Set to 'false' to skip.
    required: false
    default: 'true'
  ignore-renv:
    description: 'Skip renv setup if set to true'
    required: false
    default: 'false'
  extra-packages:
    description: >-
      CI tool packages (e.g., covr, pkgdown, rcmdcheck), one per line. For renv
      projects (all OSes), installed after renv restore into .libPaths()[1] so
      the check step finds them: only packages not already present are installed,
      and with upgrade = FALSE so the renv.lock-pinned dependency versions that
      restore just installed are preserved. For non-renv projects, forwarded to
      setup-r-dependencies.
    required: false
    default: ''

outputs:
  renv_detected:
    description: 'Whether renv.lock was detected'
    value: ${{ steps.check-renv.outputs.renv_detected }}
  installed-r-version:
    description: 'The installed R version'
    value: ${{ steps.setup-r.outputs.installed-r-version }}

runs:
  using: composite
  steps:
    - name: Setup .NET
      if: inputs.dotnet-version != ''
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Setup pandoc
      if: inputs.setup-pandoc == 'true'
      uses: r-lib/actions/setup-pandoc@v2

    - name: Setup Quarto
      if: inputs.setup-quarto == 'true'
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Setup TinyTeX
      if: inputs.setup-tinytex == 'true'
      uses: r-lib/actions/setup-tinytex@v2

    # A manual Version change does not switch the dependency fields; catch it
    # here, before the install, with instructions to fix it.
    - name: Check dependency fields
      if: inputs.check-dependencies == 'true' && hashFiles('DESCRIPTION') != ''
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../scripts/manage_description.sh" check-dependencies DESCRIPTION

    # pak ignores Additional_repositories in DESCRIPTION, so add them to the
    # repos here. A release version lists the R-universe of its OSP
    # dependencies there; a dev version resolves them from Remotes instead.
    - name: Resolve extra repositories
      id: repos
      shell: bash
      env:
        EXTRA_REPOSITORIES: ${{ inputs.extra-repositories }}
      run: |
        additional=''
        if [ -f DESCRIPTION ]; then
          additional=$(awk '/^Additional_repositories:/{in_f=1; sub(/^[^:]*:/, ""); print; next} in_f && /^[ \t]/{print; next} {in_f=0}' DESCRIPTION)
        fi
        # One URL per line, trailing slashes dropped, duplicates removed
        # (case-insensitive), then joined with spaces for setup-r.
        repos=$(printf '%s %s' "$EXTRA_REPOSITORIES" "$additional" \
          | tr ',\t\r\n' '    ' | tr -s ' ' '\n' | sed -e '/^$/d' -e 's#/*$##' \
          | awk '!seen[tolower($0)]++' | paste -sd ' ' -)
        if [ -n "$repos" ]; then echo "Extra repositories: $repos"; fi
        echo "repos=$repos" >> "$GITHUB_OUTPUT"

    - name: Setup R
      id: setup-r
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: ${{ inputs.use-public-rspm }}
        extra-repositories: ${{ steps.repos.outputs.repos }}

    # use_renv: restore renv.lock unless ignore-renv is set. renv.lock matches
    # the Version: release-pr and dev-pr re-snapshot it whenever the OSP
    # dependency fields switch between GitHub and the R-universe.
    - name: Check for renv.lock
      id: check-renv
      shell: bash
      env:
        IGNORE_RENV: ${{ inputs.ignore-renv }}
      run: |
        detected=false
        if [ -f renv.lock ]; then detected=true; fi
        use_renv="$detected"
        if [ "$IGNORE_RENV" = 'true' ]; then use_renv=false; fi
        echo "renv_detected=$detected" >> "$GITHUB_OUTPUT"
        echo "use_renv=$use_renv" >> "$GITHUB_OUTPUT"

    - name: Setup renv (Linux/macOS)
      if: steps.check-renv.outputs.use_renv == 'true' && runner.os != 'Windows'
      uses: r-lib/actions/setup-renv@v2

    # Windows: point R_LIBS_USER to a cacheable absolute path and install
    # packages there via renv::restore(library=...) on cache miss.
    # On cache hit, R finds packages directly — no renv restore needed.
    - name: Configure R library for caching (Windows)
      if: steps.check-renv.outputs.use_renv == 'true' && runner.os == 'Windows'
      shell: bash
      run: |
        R_LIB_PATH="${{ runner.temp }}/R-lib"
        mkdir -p "${R_LIB_PATH}"
        echo "R_LIBS_USER=${R_LIB_PATH}" >> $GITHUB_ENV
        echo "RENV_CONFIG_AUTOLOADER_ENABLED=FALSE" >> $GITHUB_ENV

    - name: Cache R library (Windows)
      if: steps.check-renv.outputs.use_renv == 'true' && runner.os == 'Windows'
      id: cache-renv-win
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/R-lib
        key: r-lib-${{ runner.os }}-${{ steps.setup-r.outputs.installed-r-version }}-${{ hashFiles('renv.lock') }}

    # The autoloader is off, so renv/activate.R does not install the locked
    # renv. Restore renv first, then restore the rest in a new R session, which
    # loads the locked renv from R_LIBS_USER.
    - name: Install packages from renv.lock (Windows, cache miss)
      if: steps.check-renv.outputs.use_renv == 'true' && runner.os == 'Windows' && steps.cache-renv-win.outputs.cache-hit != 'true'
      shell: bash
      env:
        PKGCACHE_HTTP_VERSION: '1.1'
      run: |
        Rscript -e 'lib <- Sys.getenv("R_LIBS_USER")' \
          -e 'if (!requireNamespace("renv", quietly = TRUE)) install.packages("renv", lib = lib, repos = Sys.getenv("RSPM", "https://cloud.r-project.org"))' \
          -e 'renv::restore(library = lib, packages = "renv")'
        Rscript -e 'message("Restoring with renv ", packageVersion("renv"))' \
          -e 'renv::restore(library = Sys.getenv("R_LIBS_USER"))'

    # Runs after both setup branches so the library is populated. .libPaths()[1]
    # is the library the check step reads on every OS (renv project lib on
    # Linux/macOS, redirected R_LIBS_USER on Windows). Installs only missing
    # packages: the Windows cache key excludes extra-packages, so a cache hit can
    # return a lib predating a newly-added tool.
    - name: Install extra CI tool packages (renv projects)
      if: inputs.extra-packages != '' && steps.check-renv.outputs.use_renv == 'true'
      shell: Rscript {0}
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
        PKGCACHE_HTTP_VERSION: '1.1'
      run: |
        lib <- .libPaths()[1]
        specs <- strsplit(Sys.getenv("EXTRA_PACKAGES"), "\\s+")[[1]]
        specs <- specs[nzchar(specs)]
        # A bare name ("rcmdcheck") is skipped when already installed. A spec
        # carrying a source or version ("type::pkg", "owner/repo", "pkg@ref")
        # asks for a specific build that a namespace presence check cannot
        # validate, so always hand it to pak (which resolves the right version
        # and is idempotent) rather than skipping on a same-named package.
        present <- vapply(
          specs,
          function(s) !grepl("[:/@]", s) && requireNamespace(s, quietly = TRUE),
          logical(1)
        )
        missing <- specs[!present]
        if (length(missing) > 0L) {
          if (!requireNamespace("pak", quietly = TRUE)) {
            # r-lib binary repo avoids source compilation when no CRAN/RSPM
            # binary exists yet (e.g. days after a new R release).
            install.packages(
              "pak",
              lib = lib,
              repos = sprintf(
                "https://r-lib.github.io/p/pak/stable/%s/%s/%s",
                .Platform$pkgType,
                R.Version()$os,
                R.Version()$arch
              )
            )
          }
          # upgrade = FALSE preserves the renv.lock-pinned dep versions that
          # restore() just installed; without it pak could replace them and the
          # check would run against an off-lock library.
          pak::pkg_install(missing, lib = lib, upgrade = FALSE)
        }

    - name: Setup R dependencies
      if: steps.check-renv.outputs.use_renv != 'true'
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: ${{ inputs.extra-packages }}
