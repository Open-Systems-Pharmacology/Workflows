on:
  workflow_call:
    inputs:
      os-matrix:
        description: 'JSON array of {os, r} objects for the build matrix. Defaults to all three platforms with R release.'
        required: false
        type: string
        default: >-
          [{"os": "${{ vars.GHA_DEFAULT_RUNNER_WINDOWS || 'windows-latest' }}", "r": "release"},
          {"os": "${{ vars.GHA_DEFAULT_RUNNER_UBUNTU || 'ubuntu-latest' }}", "r": "release"},
          {"os": "${{ vars.GHA_DEFAULT_RUNNER_MACOS || 'macos-latest' }}", "r": "release"}]
      setup-quarto:
        description: 'Whether to install Quarto (needed for packages with Quarto vignettes).'
        required: false
        type: boolean
        default: false
      setup-tinytex:
        description: 'Whether to install TinyTeX (provides pdflatex for PDF manual builds).'
        required: false
        type: boolean
        default: false
      extra-repositories:
        description: 'Extra CRAN-like repositories to add to getOption("repos") (e.g. an R-universe such as https://open-systems-pharmacology.r-universe.dev). Comma/space-separated, or one URL per line. Forwarded to setup-r-env, which also adds the DESCRIPTION Additional_repositories, so a package that follows the dev/release dependency model needs no value here.'
        required: false
        type: string
        default: ''

name: R-CMD-check-released-deps.yaml

permissions: read-all

jobs:
  # Check the package against the latest *released* OSP dependencies. This runs
  # for every version, dev (x.y.z.NNNN) and release (x.y.z) alike: an
  # intermediate dev version must also be testable against released deps, so the
  # DESCRIPTION is switched to its release form ephemerally below (no
  # Remotes, R-universe in Additional_repositories, which setup-r-env
  # adds to the repos).
  R-CMD-check-released-deps:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) [Released Deps]

    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.os-matrix) }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Checkout Workflows repo (for helper scripts)
        uses: actions/checkout@v7
        with:
          # Helper script from this workflow's own repo+commit (see comment in release-pr.yaml).
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .workflows-repo
          persist-credentials: false

      - name: Switch OSP dependencies to the R-universe
        shell: bash
        run: .workflows-repo/.github/scripts/manage_description.sh release-remotes DESCRIPTION >/dev/null

      # The action from the same commit as the script above: the release form
      # needs setup-r-env to add Additional_repositories to the repos.
      - name: Setup R environment
        id: setup-r-env
        uses: ./.workflows-repo/.github/actions/setup-r-env
        with:
          r-version: ${{ matrix.config.r }}
          setup-pandoc: 'true'
          setup-quarto: ${{ inputs.setup-quarto }}
          setup-tinytex: ${{ inputs.setup-tinytex }}
          ignore-renv: 'true'
          # The release form above runs on a dev version on purpose.
          check-dependencies: 'false'
          extra-repositories: ${{ inputs.extra-repositories }}
          extra-packages: |
            rcmdcheck

      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: 'c("error")'

      - name: Diagnostic message on failure
        if: failure()
        run: |
          echo "::warning::This workflow tests the package against the latest *released* versions of OSP dependencies."
          echo "::warning::If the main R-CMD-Check workflow passes but this one fails, it means the package works with development dependencies but not with the currently released ones."
          echo "::warning::A new release of one or more OSP dependencies is likely needed before this package can be released."
